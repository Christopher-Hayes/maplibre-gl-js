<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Feature State Transitions Demo</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="../../dist/maplibre-gl-dev.js"></script>
    <link href="../../dist/maplibre-gl.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #111; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 3px;
            font-family: sans-serif;
            font-size: 12px;
        }
        .controls {
            position: absolute;
            top: 120px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 3px;
            font-family: sans-serif;
            font-size: 12px;
            min-width: 200px;
        }
        .controls label {
            display: block;
            margin-bottom: 5px;
        }
        .controls input[type="range"] {
            width: 100%;
        }
        .heading-test {
            position: absolute;
            left: 2rem;
            bottom: 2rem;
            color: white;
            padding: 2rem;
            font-size: 4rem;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div class="info">
    <strong>Feature State Transitions Demo</strong><br>
    Hover over the circles to see smooth color transitions<br>
    using <code>setFeatureState()</code>
</div>
<h1 class="heading-test">setFeatureState() with Transitions</h1>
<div class="controls">
    <label for="sizeSlider">Circle Size: <span id="sizeValue">30</span></label>
    <input type="range" id="sizeSlider" min="10" max="90" value="30" step="20">
</div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: {
                'points': {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: [
                            {
                                type: 'Feature',
                                id: 1,
                                geometry: {type: 'Point', coordinates: [-100, 40]},
                                properties: {name: 'Feature 1'}
                            },
                            {
                                type: 'Feature',
                                id: 2,
                                geometry: {type: 'Point', coordinates: [-90, 40]},
                                properties: {name: 'Feature 2'}
                            },
                            {
                                type: 'Feature',
                                id: 3,
                                geometry: {type: 'Point', coordinates: [-80, 40]},
                                properties: {name: 'Feature 3'}
                            }
                        ]
                    }
                }
            },
            layers: [
                {
                    id: 'points-layer',
                    type: 'circle',
                    source: 'points',
                    paint: {
                        'circle-radius': ['feature-state', 'size'],
                        'circle-color': [
                            'case',
                            ['boolean', ['feature-state', 'hover'], false],
                            '#ff0000',  // Red when hovering
                            '#ffffff'   // White when not hovering
                        ],
                        'circle-opacity': [
                            'case',
                            ['boolean', ['feature-state', 'hover'], false],
                            1.0,
                            0.5
                        ]
                    }
                }
            ],
            // Configure transition for smooth animations
            transition: {
                duration: 300,
                delay: 0
            }
        },
        center: [-90, 40],
        zoom: 4
    });

    let hoveredFeatureId = null;

    // Initialize all features with default size
    map.on('load', () => {
        const features = map.querySourceFeatures('points');
        features.forEach(feature => {
            if (feature.id !== undefined) {
                map.setFeatureState(
                    {source: 'points', id: feature.id},
                    {size: 30}
                );
            }
        });
    });

    // Size slider handler
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    
    sizeSlider.addEventListener('input', (e) => {
        const newSize = parseInt(e.target.value);
        sizeValue.textContent = newSize;
        
        // Update size for all features - this should transition smoothly!
        const features = map.querySourceFeatures('points');
        features.forEach(feature => {
            if (feature.id !== undefined) {
                map.setFeatureState(
                    {source: 'points', id: feature.id},
                    {size: newSize}
                );
            }
        });
    });

    map.on('mousemove', 'points-layer', (e) => {
        if (e.features.length > 0) {
            const newHoveredId = e.features[0].id;
            
            // Only update if we're hovering a different feature
            if (newHoveredId !== hoveredFeatureId) {
                // Clear previous hover state
                if (hoveredFeatureId !== null) {
                    map.setFeatureState(
                        {source: 'points', id: hoveredFeatureId},
                        {hover: false}
                    );
                }

                // Set new hover state - this will now smoothly transition!
                hoveredFeatureId = newHoveredId;
                map.setFeatureState(
                    {source: 'points', id: hoveredFeatureId},
                    {hover: true}
                );
            }
        }
    });

    map.on('mouseleave', 'points-layer', () => {
        if (hoveredFeatureId !== null) {
            map.setFeatureState(
                {source: 'points', id: hoveredFeatureId},
                {hover: false}
            );
            hoveredFeatureId = null;
        }
    });
</script>
</body>
</html>
